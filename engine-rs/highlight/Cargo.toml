[package]
name = "tongs-highlight"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
gix-hash = { version = "0.28.1", features = ["sha1"] }
ropey = { version = "1.6", default-features = false }
tree-house = { version = "0.4.0", default-features = false }

# Android bundles the grammars compressed and loads them on first use instead
# (see `src/bundled.rs`), so they don't add 30 MB to every install.
[target.'cfg(target_os = "android")'.dependencies]
lzma-rust2 = { version = "0.24.0", default-features = false, features = [
  "std",
] }

[target.'cfg(not(target_os = "android"))'.dependencies]
tree-house-bindings = { version = "0.3.2", features = ["tree-sitter-language"] }
tree-sitter-bash = "0.25.1"
tree-sitter-c = "0.24.2"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-cmake = "0.7.5"
tree-sitter-cpp = { git = "https://github.com/tree-sitter/tree-sitter-cpp", rev = "8b5b49eb196bec7040441bee33b2c9a4838d6967", version = "0.23.4" }
tree-sitter-dart-orchard = "0.7.0"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-kotlin-sg = "0.4.1"
tree-sitter-language = "0.1"
tree-sitter-md = "0.5.4"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-swift = "=0.7.2"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-yaml = "0.7.2"
tree-sitter-zig = "1.1.2"

[dev-dependencies]
anyhow = "1.0.104"
lzma-rust2 = { version = "0.24.0", default-features = false, features = [
  "std",
  "encoder",
] }
tongs-engine = { version = "0.1.0", path = "../engine" }
