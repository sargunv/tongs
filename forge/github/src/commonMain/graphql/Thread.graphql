}

fragment ThreadDemilestoned on DemilestonedEvent {
  id
  createdAt
  actor {
    ...ThreadActor
  }
  milestoneTitle
}

fragment ThreadMarkedAsDuplicate on MarkedAsDuplicateEvent {
  id
  createdAt
  actor {
    ...ThreadActor
