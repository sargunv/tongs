fragment ThreadConvertToDraft on ConvertToDraftEvent {
  id
  createdAt
  actor {
    ...ThreadActor
  }
}

fragment ThreadMilestoned on MilestonedEvent {
  id
  createdAt
  actor {
    ...ThreadActor
  }
