[settings]
experimental = true
pin = true
lockfile = true

[tools]
"aqua:dprint/dprint" = "0.64.3"
"aqua:jdx/jactionlint" = "2.3.0"
"github:jdx/hk" = "2.9.0"
"core:java" = "zulu-25.38.107.0"
"core:rust" = { version = "1.99.1", profile = "minimal", components = "rustfmt,clippy", targets = "aarch64-linux-android,x86_64-linux-android" }
"github:bbqsrc/cargo-ndk" = "4.1.2"

[env]
ANDROID_HOME = "{{env.HOME}}/Android/Sdk"

[tasks.check]
run = "hk check --all"

[tasks.fix]
run = "hk fix --all"

[tasks.desktop]
description = "Run the desktop app"
run = "./gradlew :desktopApp:run"

[tasks.android]
description = "Install the release build on a connected Android device and open it; set ANDROID_SERIAL to pick a device"
run = [
  "./gradlew :androidApp:installRelease",
  "\"$ANDROID_HOME/platform-tools/adb\" shell am start -n dev.sargunv.tongs/.android.MainActivity",
]

[tasks.test]
description = "Run the engine and app tests"
run = ["cargo test", "./gradlew check"]

[hooks]
postinstall = ["hk install --mise"]
