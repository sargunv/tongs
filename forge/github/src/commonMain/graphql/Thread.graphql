    ...ThreadReference
  }
}

fragment ThreadLocked on LockedEvent {
  id
  createdAt
  actor {
    ...ThreadActor
  }
  lockReason
}

fragment ThreadUnlocked on UnlockedEvent {
  id
  createdAt
  actor {
    ...ThreadActor
