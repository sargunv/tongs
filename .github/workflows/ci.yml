name: CI

# Pull requests and main. Main also publishes its release APK on the floating
# `snapshot` tag, replacing the previous one.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Pull requests cancel superseded runs. Main queues them, so snapshots publish
# in order.
concurrency:
  group:
    ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-deps
        with:
          save-toolchains: "true"
          rust-cache: clippy
      - run: mise run check

  test:
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci-deps
        with:
          rust-cache: test
          gradle: "true"
      - run: mise run test
      - name: Upload test reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: 14
          if-no-files-found: warn
          name: test-reports
          path: |
            **/build/reports
            **/build/test-results
            **/build/outputs/roborazzi

  android:
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The version code counts commits.
          fetch-depth: 0
      - uses: ./.github/actions/setup-ci-deps
        with:
          rust-cache: android
          gradle: "true"
          ndk: "true"
      # Main signs with the snapshot key, so each snapshot installs over the
      # last. Pull requests sign with the runner's debug key.
      - name: Decode the snapshot key
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set"
            exit 1
          fi
          keystore="$RUNNER_TEMP/snapshot.keystore"
          base64 -d <<<"$KEYSTORE_BASE64" >"$keystore"
          echo "TONGS_KEYSTORE=$keystore" >>"$GITHUB_ENV"
      - name: Build the APK
        env:
          TONGS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TONGS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TONGS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew :androidApp:assembleRelease
          mkdir -p build/apk
          cp androidApp/build/outputs/apk/release/androidApp-release.apk build/apk/dev.sargunv.tongs.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: 7
          if-no-files-found: error
          name: android-apk
          path: build/apk/dev.sargunv.tongs.apk

  # Uploads the APK before moving the tag, so a failed upload leaves the
  # previous snapshot whole.
  snapshot:
    needs: [check, test, android]
    if: ${{ github.ref == 'refs/heads/main' }}
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-apk
          path: build/apk
      - name: Publish the snapshot
        run: |
          if ! gh api "repos/$GH_REPO/git/ref/tags/snapshot" >/dev/null 2>&1; then
            gh api "repos/$GH_REPO/git/refs" -f ref=refs/tags/snapshot -f sha="$GITHUB_SHA" >/dev/null
          fi
          notes="Release build of $GITHUB_SERVER_URL/$GH_REPO/commit/$GITHUB_SHA, replaced on every push to main."
          if ! gh release view snapshot >/dev/null 2>&1; then
            gh release create snapshot --verify-tag --prerelease --title Snapshot --notes "$notes"
          fi
          gh release upload snapshot build/apk/dev.sargunv.tongs.apk --clobber
          gh api -X PATCH "repos/$GH_REPO/git/refs/tags/snapshot" -f sha="$GITHUB_SHA" -F force=true >/dev/null
          gh release edit snapshot --notes "$notes"

  # The required check. A job skipped by its `if` passes.
  all-good:
    if: ${{ always() }}
    needs: [check, test, android, snapshot]
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -e -n --argjson results "$RESULTS" 'all($results[]; .result == "success" or .result == "skipped")'
